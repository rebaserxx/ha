lighting_apply_profile_core:
  alias: Lighting Apply Profile Core
  description: >-
    Generic lighting engine. Turns one or more areas on with a named profile, or off.
    The profile table below is the ONLY place brightness / colour temperature defaults live;
    automations pass a profile name, never numbers.
  mode: restart
  fields:
    target_areas:
      description: Area IDs to target (list).
      example: "['living_room', 'dining_room']"
    profile:
      description: Profile to apply when action is on.
      example: "evening"
      selector:
        select:
          options:
            - "day"
            - "morning"
            - "evening_full"
            - "evening"
            - "late"
            - "night"
    action:
      description: Turn lights on with the profile, or off.
      example: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
    transition:
      description: Transition time in seconds.
      example: 2
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
  sequence:
    - variables:
        selected_areas: "{{ target_areas | default([], true) }}"
        selected_profile: >-
          {% set p = (profile | default('evening') | string | lower) %}
          {{ p if p in ['day', 'morning', 'evening_full', 'evening', 'late', 'night'] else 'evening' }}
        selected_action: "{{ 'off' if (action | default('on') | string | lower) in ['off', 'false', '0'] else 'on' }}"
        selected_transition: "{{ transition | default(2) | int(2) }}"
        # Profile defaults. Change numbers here, nowhere else.
        profile_table:
          day:          {brightness_pct: 100, color_temp_kelvin: 4000}
          morning:      {brightness_pct: 80,  color_temp_kelvin: 4000}
          evening_full: {brightness_pct: 100, color_temp_kelvin: 2700}
          evening:      {brightness_pct: 80,  color_temp_kelvin: 2700}
          late:         {brightness_pct: 15,  color_temp_kelvin: 2700}
          night:        {brightness_pct: 10,  color_temp_kelvin: 2000}
        chosen: "{{ profile_table[selected_profile] }}"
    - condition: template
      value_template: "{{ selected_areas | count > 0 }}"
    - choose:
        - conditions: "{{ selected_action == 'off' }}"
          sequence:
            - action: light.turn_off
              target:
                area_id: "{{ selected_areas }}"
              data:
                transition: "{{ selected_transition }}"
      default:
        - action: light.turn_on
          target:
            area_id: "{{ selected_areas }}"
          data:
            brightness_pct: "{{ chosen.brightness_pct }}"
            color_temp_kelvin: "{{ chosen.color_temp_kelvin }}"
            transition: "{{ selected_transition }}"

lighting_common_areas:
  alias: Lighting Common Areas
  description: Wrapper for internal common-area lighting (excluding Lounge).
  mode: restart
  fields:
    profile:
      description: Profile name (see lighting_apply_profile_core).
      example: "evening"
    action:
      description: on or off.
      example: "on"
    transition:
      description: Transition time in seconds.
      example: 2
  sequence:
    - action: script.lighting_apply_profile_core
      data:
        target_areas:
          - attic_lounge
          - dining_room
          - kitchen
          - hallway
          - landing
          - side_hall
        profile: "{{ profile | default('evening') }}"
        action: "{{ action | default('on') }}"
        transition: "{{ transition | default(2) }}"

