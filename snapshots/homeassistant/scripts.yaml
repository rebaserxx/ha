lighting_dim_if_on:
  alias: Lighting Dim If On
  description: >-
    Apply a profile only to lights in the given areas (plus optional extra entities) that are
    already on. Never turns anything on. Used by the 19:00 and late-evening dims.
  mode: restart
  fields:
    target_areas:
      description: Area IDs (list).
      example: "['living_room']"
    extra_entities:
      description: Extra light entity IDs to include (list).
      example: "['light.office_filament']"
    profile:
      description: evening or late.
      example: "late"
      selector:
        select:
          options:
            - "evening"
            - "late"
    transition:
      description: Transition time in seconds.
      example: 3
  sequence:
    - variables:
        table:
          evening: {brightness_pct: 80, color_temp_kelvin: 2700}
          late:    {brightness_pct: 15, color_temp_kelvin: 2700}
        chosen: "{{ table[profile | default('evening')] }}"
        on_lights: >-
          {% set ns = namespace(ids=[]) %}
          {% for a in (target_areas | default([], true)) %}
            {% set ns.ids = ns.ids + area_entities(a) %}
          {% endfor %}
          {% set ns.ids = ns.ids + (extra_entities | default([], true)) %}
          {{ expand(ns.ids) | selectattr('domain', 'eq', 'light') | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id') | list }}
    - condition: template
      value_template: "{{ on_lights | count > 0 }}"
    - action: light.turn_on
      target:
        entity_id: "{{ on_lights }}"
      data:
        brightness_pct: "{{ chosen.brightness_pct }}"
        color_temp_kelvin: "{{ chosen.color_temp_kelvin }}"
        transition: "{{ transition | default(3) | int(3) }}"

lighting_wait_seasonal_offset:
  alias: Lighting Wait Seasonal Offset
  description: >-
    RETIRED 2026-09-15 (audit Phase 4): the dusk/dawn automations now trigger on sun elevation,
    which self-adjusts by season and survives restarts. Kept for one week as a rollback aid; no
    automation calls it. Delete after 2026-09-22.
  mode: parallel
  fields:
    offset_direction:
      description: plus adds time after the solar event; minus uses anchor_minutes to run before the event.
      example: "plus"
    anchor_minutes:
      description: Required for minus mode.
      example: 60
    summer_minutes:
      description: Seasonal offset for June-August.
      example: 15
    shoulder_minutes:
      description: Seasonal offset for March-May and September-November.
      example: 30
    winter_minutes:
      description: Seasonal offset for December-February.
      example: 45
  sequence:
    - variables:
        month: "{{ now().month }}"
        direction: "{{ offset_direction | default('plus') | string | lower }}"
        anchor: "{{ anchor_minutes | default(60) | int(60) }}"
        summer: "{{ summer_minutes | default(15) | int(15) }}"
        shoulder: "{{ shoulder_minutes | default(30) | int(30) }}"
        winter: "{{ winter_minutes | default(45) | int(45) }}"
        season_minutes: >-
          {% if month in [6, 7, 8] %}
            {{ summer | int }}
          {% elif month in [3, 4, 5, 9, 10, 11] %}
            {{ shoulder | int }}
          {% else %}
            {{ winter | int }}
          {% endif %}
        wait_minutes: >-
          {% if direction == 'minus' %}
            {{ [anchor | int - season_minutes | int, 0] | max }}
          {% else %}
            {{ season_minutes | int }}
          {% endif %}
        wait_seconds: "{{ wait_minutes | int * 60 }}"
        wait_hms: >-
          {% set s = wait_seconds | int %}
          {{ '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60) }}
    - delay: "{{ wait_hms }}"

tado_gas_set_manual_baseline:
  alias: Tado Gas Set Manual Baseline
  description: Re-anchor the derived gas register to an actual physical meter reading. Sets the baseline helper so derived register = baseline + Octopus statistics total.
  mode: single
  fields:
    manual_reading:
      description: Whole-number gas meter register reading taken from the physical meter.
      example: 27007
      required: true
      selector:
        number:
          min: 0
          max: 999999
          step: 1
          mode: box
    submission_date:
      description: Optional date to store as last submission date (leave empty to keep current).
      example: "2026-07-12"
      selector:
        date: {}
  sequence:
    - variables:
        manual_int: "{{ manual_reading | int(0) }}"
        stat_total: "{{ states('sensor.octopus_gas_statistics_total') | float(0) }}"
        new_baseline: "{{ (manual_int - stat_total) | round(3) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.tado_gas_meter_baseline_m3
      data:
        value: "{{ new_baseline }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ submission_date is defined and submission_date not in [none, ''] }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tado_gas_meter_last_submission_date
              data:
                date: "{{ submission_date }}"
    - action: persistent_notification.create
      data:
        title: Tado Gas Baseline Updated
        message: >-
          Manual reading {{ manual_int }} applied.
          Octopus statistics total is {{ stat_total }} m³; baseline set to {{ new_baseline }}.
          Derived register now reads {{ (manual_int | float(0)) | round(3) }} m³.

tado_hot_water_auto:
  alias: Tado Hot Water Auto
  description: Return Tado hot water to schedule mode.
  mode: single
  sequence:
    - action: water_heater.set_operation_mode
      target:
        entity_id: water_heater.hot_water
      data:
        operation_mode: auto

tado_hot_water_off:
  alias: Tado Hot Water Off
  description: Turn Tado hot water off.
  mode: single
  sequence:
    - action: water_heater.turn_off
      target:
        entity_id: water_heater.hot_water

tado_hot_water_boost:
  alias: Tado Hot Water Boost
  description: Turn on Tado hot water for a fixed time period.
  mode: single
  fields:
    duration_minutes:
      description: Boost duration in minutes.
      example: 60
      selector:
        number:
          min: 5
          max: 180
          step: 5
          mode: box
  sequence:
    - variables:
        boost_minutes: "{{ duration_minutes | default(60) | int(60) }}"
        boost_seconds: "{{ boost_minutes * 60 }}"
        boost_hms: >-
          {% set s = boost_seconds | int %}
          {{ '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60) }}
    - action: tado.set_water_heater_timer
      target:
        entity_id: water_heater.hot_water
      data:
        time_period: "{{ boost_hms }}"
