- id: tado_gas_meter_reading_weekly_from_octopus
  alias: Tado - Submit Weekly Gas Meter Reading From Octopus
  description: Submit the statistics-derived cumulative gas register to Tado Energy IQ weekly, dated at the end of the underlying statistics data. Checks daily and submits once at least 7 days have passed and the integer register has increased. No freshness condition needed because readings are dated at their data horizon.
  triggers:
    - trigger: time
      at: "18:00:00"
  conditions:
    - condition: template
      value_template: >-
        {{ states('sensor.tado_gas_meter_register_derived')
           not in ['unknown', 'unavailable', 'none', 'None', ''] }}
    - condition: template
      value_template: >-
        {% set last = states('input_datetime.tado_gas_meter_last_submission_date') %}
        {{ last in ['unknown', 'unavailable', '']
           or (now().date() - strptime(last, '%Y-%m-%d').date()).days >= 7 }}
    - condition: template
      value_template: >-
        {{ states('sensor.tado_gas_meter_register_derived') | float(0) | int(0)
           > states('input_number.tado_gas_meter_last_submitted_m3') | float(0) | int(0) }}
  actions:
    - variables:
        tado_register_m3: "{{ states('sensor.tado_gas_meter_register_derived') | float(0) | int(0) }}"
        reading_date: >-
          {{ ((state_attr('sensor.octopus_gas_statistics_total', 'last_stat_ts') | float(0)) + 3600)
             | timestamp_custom('%Y-%m-%d') }}
    - action: shell_command.tado_submit_dated_meter_reading
      data:
        reading: "{{ tado_register_m3 }}"
        date: "{{ reading_date }}"
      response_variable: submit_result
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ submit_result.returncode == 0 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.tado_gas_meter_last_submitted_m3
              data:
                value: "{{ tado_register_m3 }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tado_gas_meter_last_submission_date
              data:
                date: "{{ now().date() | string }}"
            - action: persistent_notification.dismiss
              data:
                notification_id: tado_gas_meter_submission_failed
      default:
        - action: persistent_notification.create
          data:
            notification_id: tado_gas_meter_submission_failed
            title: Tado Gas Meter Submission Failed
            message: >-
              Dated meter reading submission failed (reading {{ tado_register_m3 }},
              date {{ reading_date }}). Will retry tomorrow at 18:00.
              stderr: {{ submit_result.stderr | default('') | truncate(400) }}
  mode: single

- id: tado_gas_meter_submission_overdue_alert
  alias: Tado - Gas Meter Submission Overdue Alert
  description: Alert if no Tado gas meter reading has been submitted for more than 10 days.
  triggers:
    - trigger: time
      at: "19:00:00"
  conditions: []
  actions:
    - variables:
        last_submission: "{{ states('input_datetime.tado_gas_meter_last_submission_date') }}"
        days_since: >-
          {% if last_submission in ['unknown', 'unavailable', ''] %}
            999
          {% else %}
            {{ (now().date() - strptime(last_submission, '%Y-%m-%d').date()).days }}
          {% endif %}
        last_stat_ts: "{{ state_attr('sensor.octopus_gas_statistics_total', 'last_stat_ts') | float(0) }}"
        stat_age_days: >-
          {{ ((now().timestamp() - last_stat_ts) / 86400) | round(1) if last_stat_ts > 0 else 'unknown' }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ days_since | int(0) > 10 }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: tado_gas_meter_submission_overdue
                title: Tado Gas Meter Submission Overdue
                message: >-
                  No Tado gas meter reading submitted for {{ days_since | int(0) }} days
                  (last: {{ last_submission }}).
                  Octopus statistics data age: {{ stat_age_days }} days.
                  Derived register: {{ states('sensor.tado_gas_meter_register_derived') }} m³.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: tado_gas_meter_submission_overdue
  mode: single

- id: octopus_energy_gas_rollover_health_daily_check
  alias: Octopus Energy - Gas Rollover Health Check
  description: Alert if Octopus gas previous-day rollover (last_reset) is missing or 2+ days stale.
  triggers:
    - trigger: time
      at: "23:45:00"
  conditions: []
  actions:
    - variables:
        gas_kwh_sensor: sensor.octopus_energy_gas_e6s10414361656_2215950002_previous_accumulative_consumption_kwh
        gas_m3_sensor: sensor.octopus_energy_gas_e6s10414361656_2215950002_previous_accumulative_consumption_m3
        expected_last_reset_date: "{{ ((today_at('00:00') - timedelta(days=1)).date() | string) }}"
        gas_kwh_state: "{{ states(gas_kwh_sensor) }}"
        gas_m3_state: "{{ states(gas_m3_sensor) }}"
        gas_last_reset_raw: "{{ state_attr(gas_kwh_sensor, 'last_reset') }}"
        gas_last_reset_date: >-
          {% if gas_last_reset_raw in [none, 'unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ (gas_last_reset_raw | as_datetime | as_local).date() | string }}
          {% endif %}
        gas_days_behind: >-
          {% if gas_last_reset_date == 'unknown' %}
            999
          {% else %}
            {{ ((today_at('00:00') - timedelta(days=1)).date() - (gas_last_reset_raw | as_datetime | as_local).date()).days }}
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ gas_kwh_state in ['unknown', 'unavailable', 'none', 'None', '']
                   or gas_days_behind | int(999) >= 2 }}
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: octopus_energy_gas_rollover_health
                title: Octopus Energy Gas Rollover Check Failed
                message: >-
                  Octopus gas last_reset is {{ gas_days_behind | int(999) }} day(s) behind:
                  expected {{ expected_last_reset_date }}, got {{ gas_last_reset_date }} (local date).
                  kWh state: {{ gas_kwh_state }}.
                  m3 state: {{ gas_m3_state }}.
                  Check Octopus integration diagnostics and Energy statistics continuity.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: octopus_energy_gas_rollover_health
  mode: single

- id: system_backup_stale_daily_check
  alias: System - Backup Stale Daily Check
  description: Alert if Home Assistant automatic backups are stale or backup manager sensors are unhealthy.
  triggers:
    - trigger: time
      at: "09:00:00"
  conditions: []
  actions:
    - variables:
        last_success_raw: "{{ states('sensor.backup_last_successful_automatic_backup') }}"
        last_attempted_raw: "{{ states('sensor.backup_last_attempted_automatic_backup') }}"
        next_backup_raw: "{{ states('sensor.backup_next_scheduled_automatic_backup') }}"
        manager_state: "{{ states('sensor.backup_backup_manager_state') }}"
        last_success_ts: >-
          {% if last_success_raw in ['unknown', 'unavailable', 'none', 'None', ''] %}
            0
          {% else %}
            {{ as_timestamp(last_success_raw, 0) }}
          {% endif %}
        backup_age_hours: "{{ ((as_timestamp(now()) - (last_success_ts | float(0))) / 3600) | round(1) }}"
        backup_stale: "{{ (last_success_ts | float(0)) == 0 or (as_timestamp(now()) - (last_success_ts | float(0))) > 36 * 3600 }}"
        manager_unhealthy: "{{ manager_state in ['unknown', 'unavailable', 'none', 'None', '', 'failed', 'error'] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ backup_stale or manager_unhealthy }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: system_backup_health
                title: Home Assistant Backup Check Failed
                message: >-
                  Last successful automatic backup: {{ last_success_raw }}.
                  Backup age: {{ backup_age_hours }} hours.
                  Last attempted backup: {{ last_attempted_raw }}.
                  Next scheduled backup: {{ next_backup_raw }}.
                  Backup manager state: {{ manager_state }}.
                  Check Settings > System > Backups and confirm Home Assistant Cloud backup status.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: system_backup_health
  mode: single

- id: system_watchman_daily_check
  alias: System - Watchman Daily Check
  description: Alert if Watchman reports missing entities/actions or if Watchman sensors are unavailable.
  triggers:
    - trigger: time
      at: "09:05:00"
  conditions: []
  actions:
    - variables:
        watchman_status: "{{ states('sensor.watchman_status') }}"
        missing_entities_raw: "{{ states('sensor.watchman_missing_entities') }}"
        missing_actions_raw: "{{ states('sensor.watchman_missing_actions') }}"
        missing_entities_count: "{{ missing_entities_raw | int(0) }}"
        missing_actions_count: "{{ missing_actions_raw | int(0) }}"
        last_parse_raw: "{{ states('sensor.watchman_last_parse') }}"
        parse_duration_raw: "{{ states('sensor.watchman_parse_duration') }}"
        watchman_unavailable: >-
          {{ watchman_status in ['unknown', 'unavailable', 'none', 'None', '']
             or missing_entities_raw in ['unknown', 'unavailable', 'none', 'None', '']
             or missing_actions_raw in ['unknown', 'unavailable', 'none', 'None', ''] }}
        watchman_has_issues: "{{ (missing_entities_count | int(0)) > 0 or (missing_actions_count | int(0)) > 0 or watchman_unavailable }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ watchman_has_issues }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: system_watchman_health
                title: Watchman Found Home Assistant Issues
                message: >-
                  Watchman status: {{ watchman_status }}.
                  Missing entities: {{ missing_entities_raw }}.
                  Missing actions: {{ missing_actions_raw }}.
                  Last parse: {{ last_parse_raw }}.
                  Parse duration: {{ parse_duration_raw }}.
                  Open the Home Health dashboard or run Watchman report generation before editing dependent YAML.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: system_watchman_health
  mode: single

- id: ev_ohme_sync_renault_state_of_charge
  alias: EV - Sync Renault State of Charge to Ohme
  description: >-
    Keep Ohme's idea of the Renault's battery level correct while it is plugged in at home,
    because Ohme has disabled its own Renault integration and its internal estimate drifts
    badly on long top-ups (measured: Ohme's figure updated 3 times in 7 hours over a 51->91%
    session while the Renault reported 40 times).
    Writes only the state-of-charge input, which the integration maps to
    PUT /v1/car/{id}/state-of-charge - it touches no session endpoint, so it cannot start,
    approve or resume a charge. Intelligent Octopus Go keeps control of when charging happens.
    The charger is shared with a Honda e:Ny1, which since 2026-09-01 has its own Home
    Assistant entities and its own paired automation (ev_ohme_sync_honda_state_of_charge).
    This one still acts only when the Renault itself reports plugged in AND at home, and it
    selects the Renault in Ohme first because Ohme applies state-of-charge to whichever
    vehicle is currently selected. The two cars cannot both act: the Honda automations stand
    down whenever the Renault reports plugged in at home, so the Renault wins any tie.
  triggers:
    # Ohme sees the plug-in first - typically ~90s before the Renault cloud catches up.
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      from: unplugged
      not_to: ["unavailable", "unknown"]
      id: plugged_in
    # ...so the Renault confirming the plug is also a trigger, otherwise the run above
    # fails its plug condition and nothing ever retries it.
    - trigger: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      to: "on"
      id: renault_plugged
    # The Renault polls every 7 minutes and reports ~1% per poll at 7kW, which is what
    # keeps Ohme corrected through a long charge.
    - trigger: state
      entity_id: sensor.renault_scenic_e_tech_battery
      not_to: ["unavailable", "unknown"]
      id: soc_refreshed
  conditions:
    # Ohme must have a car connected. state_of_charge_input is unavailable when unplugged.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.ohme_home_pro_status
          state: ["unplugged", "unavailable", "unknown"]
    # The Renault must be the car on the end of this cable: plugged in, and at home.
    # Without the location check, the Renault plugged in at work would make us switch
    # Ohme to the Renault while the Honda is actually on the home charger.
    - condition: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      state: "on"
    - condition: state
      entity_id: device_tracker.renault_scenic_e_tech_location
      state: home
    # Usable reading, and only write when Ohme does not already agree.
    # No staleness gate: a reading that looks days old is still correct when the car has
    # been parked, and the 7-minute poll tracks a charge accurately. Age is not the failure
    # mode here, so gating on it would block correct writes.
    - condition: template
      value_template: >-
        {% set r = states('sensor.renault_scenic_e_tech_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ 0 <= r <= 100 and (r | round(0) | int) != (o | round(0) | int) }}
    # Mid-charge corrections are throttled to one per 15 minutes (~20 writes on a 40% top-up
    # instead of ~39, keeping Ohme within ~2%). A deadband was measured and rejected: it only
    # cut 39 fires to 38, because the gap is large rather than marginal. Plug-in triggers
    # bypass the throttle - that write sets the figure Ohme plans the whole session against.
    - condition: or
      conditions:
        - condition: trigger
          id: ["plugged_in", "renault_plugged"]
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 900 }}
  actions:
    # Ohme applies state-of-charge to the selected vehicle (client._cars[0]), so make sure
    # that is the Renault before writing. This is PUT /v1/car/{id}/select - it cannot start
    # a charge. The vehicle select uses the 30-minute device-info coordinator and its
    # refresh is debounced, so allow it to land before writing.
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.ohme_home_pro_vehicle
                  state: "Renault Scenic (2023-2025)"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.ohme_home_pro_vehicle
              data:
                option: "Renault Scenic (2023-2025)"
            - delay: "00:00:30"
    - action: number.set_value
      target:
        entity_id: number.utilities_ohme_home_pro_state_of_charge_input
      data:
        value: "{{ states('sensor.renault_scenic_e_tech_battery') | float(0) | round(0) | int }}"
  mode: single
  max_exceeded: silent

- id: ev_ohme_auto_approve_renault_charge
  alias: EV - Auto-Approve Ohme Charge for Renault
  description: >-
    Approve a pending Ohme charge session automatically when the Renault is the car on the
    cable at home, so it does not sit waiting for a tap in the app.
    UNLIKE ev_ohme_sync_renault_state_of_charge, this automation DELIBERATELY starts a charge.
    It presses button.ohme_home_pro_approve_charge, which maps to
    PUT /v1/chargeSessions/{serial}/approve?approve=true. Ohme and Intelligent Octopus Go
    decide timing from there, but approving can begin delivery immediately at the prevailing
    rate - on 2026-08-31 a manually approved smart_charge session went to 7 kW straight away
    in the afternoon at 27.95p/kWh. That cost trade-off was reviewed and accepted by the
    project user. Keep charge-causing actions in THIS automation only.
  triggers:
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      to: pending_approval
      id: session_pending
    # Ohme reaches pending_approval roughly 90s before the Renault confirms the plug, so at
    # the moment of session_pending the plug condition below is usually still false. This
    # second trigger is what actually carries the approval through.
    - trigger: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      to: "on"
      id: renault_plugged
  conditions:
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
    # Only approve for the Renault. The Honda e:Ny1 on the same charger has its own
    # auto-approve automation (ev_ohme_auto_approve_honda_charge) as of 2026-09-01; that one
    # stands down whenever these Renault conditions hold, so the Renault wins any tie.
    - condition: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      state: "on"
    - condition: state
      entity_id: device_tracker.renault_scenic_e_tech_location
      state: home
    # Never auto-approve a flat-out max charge. Written as a negation on purpose:
    # select.ohme_home_pro_charge_mode is `unavailable` during PENDING_APPROVAL because
    # client.mode is None in that state, so requiring `smart_charge` would never pass.
    - condition: not
      conditions:
        - condition: state
          entity_id: select.ohme_home_pro_charge_mode
          state: max_charge
  actions:
    # Let the state-of-charge sync land first so Ohme plans this session against the
    # Renault's real battery level rather than a stale or wrong-vehicle figure. Approve
    # anyway on timeout rather than leaving the car waiting indefinitely.
    - wait_template: >-
        {% set r = states('sensor.renault_scenic_e_tech_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ 0 <= r <= 100 and (r | round(0) | int) == (o | round(0) | int) }}
      timeout: "00:05:00"
      continue_on_timeout: true
    # It may have been approved in the app while we waited.
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
    - action: button.press
      target:
        entity_id: button.ohme_home_pro_approve_charge
  mode: single
  max_exceeded: silent

- id: ev_ohme_sync_honda_state_of_charge
  alias: EV - Sync Honda State of Charge to Ohme
  description: >-
    Keep Ohme's idea of the Honda e:Ny1's battery level correct while it is plugged in at
    home. Mirrors ev_ohme_sync_renault_state_of_charge for the second car on the shared
    charger. Writes only the state-of-charge input, which the integration maps to
    PUT /v1/car/{id}/state-of-charge - it touches no session endpoint, so it cannot start,
    approve or resume a charge. Intelligent Octopus Go keeps control of when charging happens.
    DIFFERENCE FROM THE RENAULT: the Renault polls every ~7 minutes, so its readings can be
    trusted as-is. The Honda's cloud data can be many hours stale - measured 6h50m old on
    2026-09-01 while HA had just polled the integration. So this automation presses
    button.e_ny1_refresh_from_car and waits for sensor.e_ny1_last_updated to advance before
    trusting ANY Honda reading, and aborts rather than writing a stale figure. A forced
    refresh returned fresh data in ~15s when measured on 2026-09-01.
    The Renault wins ties: if the Renault reports plugged in at home, this automation stands
    down, because the Renault's sensors are the more trustworthy of the two.
  triggers:
    # Ohme sees the plug-in first, before either car's cloud catches up.
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      from: unplugged
      not_to: ["unavailable", "unknown"]
      id: plugged_in
    - trigger: state
      entity_id: sensor.e_ny1_plug_status
      to: ["plugged_in", "connected"]
      id: honda_plugged
    - trigger: state
      entity_id: sensor.e_ny1_battery
      not_to: ["unavailable", "unknown"]
      id: soc_refreshed
    # The Honda does not stream updates through a charge the way the Renault does (~40 per
    # session), so poll it while it is the car Ohme is actually charging. Waking the car
    # this often is acceptable precisely because it is sitting on mains at the time.
    - trigger: time_pattern
      minutes: "/15"
      id: charge_tick
  conditions:
    # Ohme must have a car connected. state_of_charge_input is unavailable when unplugged.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.ohme_home_pro_status
          state: ["unplugged", "unavailable", "unknown"]
    # Stand down if the Renault says it is the car on this cable.
    - condition: not
      conditions:
        - condition: and
          conditions:
            - condition: state
              entity_id: binary_sensor.renault_scenic_e_tech_plug
              state: "on"
            - condition: state
              entity_id: device_tracker.renault_scenic_e_tech_location
              state: home
    # The periodic tick only applies once the Honda has been positively identified and
    # selected for this session, otherwise it would wake the car while the Renault charges.
    - condition: or
      conditions:
        - condition: not
          conditions:
            - condition: trigger
              id: charge_tick
        - condition: and
          conditions:
            - condition: state
              entity_id: select.ohme_home_pro_vehicle
              state: "Honda e:Ny1 (2023-)"
            - condition: state
              entity_id: sensor.ohme_home_pro_status
              state: charging
    # Mid-charge corrections are throttled. Plug-in triggers bypass the throttle - that
    # write sets the figure Ohme plans the whole session against.
    - condition: or
      conditions:
        - condition: trigger
          id: ["plugged_in", "honda_plugged"]
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 870 }}
  actions:
    # Force fresh data before trusting any Honda sensor. Abort on timeout: writing a stale
    # battery figure is worse than not writing at all, because Ohme would plan against it.
    - action: button.press
      target:
        entity_id: button.e_ny1_refresh_from_car
    - wait_template: >-
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {{ t is not none and (now() - t).total_seconds() < 300 }}
      timeout: "00:02:00"
      continue_on_timeout: false
    # Only now that the data is known fresh, confirm the Honda is the car on this cable.
    - condition: state
      entity_id: sensor.e_ny1_plug_status
      state: ["plugged_in", "connected"]
    - condition: state
      entity_id: device_tracker.e_ny1_location
      state: home
    # Usable reading, and only write when Ohme does not already agree.
    - condition: template
      value_template: >-
        {% set h = states('sensor.e_ny1_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ 0 <= h <= 100 and (h | round(0) | int) != (o | round(0) | int) }}
    # Ohme applies state-of-charge to the selected vehicle, so make sure that is the Honda
    # before writing. This is PUT /v1/car/{id}/select - it cannot start a charge. The
    # vehicle select uses the 30-minute device-info coordinator and its refresh is
    # debounced, so allow it to land before writing.
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.ohme_home_pro_vehicle
                  state: "Honda e:Ny1 (2023-)"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.ohme_home_pro_vehicle
              data:
                option: "Honda e:Ny1 (2023-)"
            - delay: "00:00:30"
    - action: number.set_value
      target:
        entity_id: number.utilities_ohme_home_pro_state_of_charge_input
      data:
        value: "{{ states('sensor.e_ny1_battery') | float(0) | round(0) | int }}"
  mode: single
  max_exceeded: silent

- id: ev_ohme_auto_approve_honda_charge
  alias: EV - Auto-Approve Ohme Charge for Honda
  description: >-
    Approve a pending Ohme charge session automatically when the Honda e:Ny1 is the car on
    the cable at home, so it does not sit waiting for a tap in the app. Mirrors
    ev_ohme_auto_approve_renault_charge.
    LIKE THAT AUTOMATION, THIS ONE DELIBERATELY STARTS A CHARGE. It presses
    button.ohme_home_pro_approve_charge, which maps to
    PUT /v1/chargeSessions/{serial}/approve?approve=true, and delivery can begin immediately
    at the prevailing rate rather than waiting for an off-peak slot. Intelligent Octopus Go
    is registered against the CHARGE POINT (provider OHME, vehicle_battery_size_in_kwh None),
    not against a specific car, so the Honda gets the same dispatch treatment the Renault
    gets and the cost trade-off the project user accepted on 2026-08-31 carries over.
    Identification is gated on FRESH Honda data: the run forces a refresh-from-car and aborts
    if the car does not report back within 2 minutes, so a stale reading can never approve a
    session. The safe failure mode is "no auto-approval, tap it in the app".
  triggers:
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      to: pending_approval
      id: session_pending
    # Ohme reaches pending_approval before the Honda cloud confirms the plug, so the car
    # confirming is also a trigger, otherwise the run above fails its plug check and
    # nothing ever retries it.
    - trigger: state
      entity_id: sensor.e_ny1_plug_status
      to: ["plugged_in", "connected"]
      id: honda_plugged
  conditions:
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
    # Stand down if the Renault says it is the car on this cable - it owns approval then.
    - condition: not
      conditions:
