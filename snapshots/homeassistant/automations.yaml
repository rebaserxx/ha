  max_exceeded: silent

- id: hot_water_boost_switch_on
  alias: Hot Water - Boost Switch On
  description: >-
    input_boolean.hot_water_boost is the family-facing "Hot Water Boost" switch on Alexa, HomeKit,
    Google and Assist. Turning it on starts a 60-minute Tado hot water timer via
    script.tado_hot_water_boost. Skipped when Tado is already boosting: the mirror automation turns
    the switch on in that case, and re-issuing the timer would silently extend the boost.
  triggers:
    - trigger: state
      entity_id: input_boolean.hot_water_boost
      to: "on"
  conditions:
    - condition: template
      value_template: >-
        {{ not (is_state('water_heater.hot_water', 'heat')
                and is_state('binary_sensor.hot_water_overlay', 'on')) }}
  actions:
    - action: script.tado_hot_water_boost
      data:
        duration_minutes: 60
  mode: single

- id: hot_water_boost_switch_off
  alias: Hot Water - Boost Switch Off
  description: >-
    Turning the boost switch off returns Tado hot water to its schedule, but only when a manual
    overlay is actually active; otherwise this is just the mirror automation resetting the switch.
  triggers:
    - trigger: state
      entity_id: input_boolean.hot_water_boost
      to: "off"
  conditions:
    - condition: state
      entity_id: binary_sensor.hot_water_overlay
      state: "on"
  actions:
    - action: script.tado_hot_water_auto
  mode: single

- id: hot_water_boost_switch_mirror
  alias: Hot Water - Mirror Tado Boost Into Switch
  description: >-
    Keeps input_boolean.hot_water_boost truthful when a boost is started or expires from the Tado
    app. "Boosting" means the water heater is in heat mode with a manual overlay active. Template
    triggers fire once per transition, so attribute-only updates from Tado do not churn the switch.
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('water_heater.hot_water', 'heat')
           and is_state('binary_sensor.hot_water_overlay', 'on') }}
      id: boost_started
    - trigger: template
      value_template: >-
        {{ not (is_state('water_heater.hot_water', 'heat')
                and is_state('binary_sensor.hot_water_overlay', 'on')) }}
      id: boost_ended
  actions:
    - action: "input_boolean.turn_{{ 'on' if trigger.id == 'boost_started' else 'off' }}"
      target:
        entity_id: input_boolean.hot_water_boost
  mode: queued

- id: house_goodnight
  alias: House - Goodnight
  description: >-
    input_boolean.goodnight is a momentary "Goodnight" switch for Alexa, HomeKit, Google and Assist,
    so a spoken "goodnight" runs Home Assistant logic instead of an assistant-side routine. Turns
    off the common areas, Lounge, front porch and David's Office filament, then resets itself.
    Bedrooms are deliberately untouched. Not gated by lighting_automations_paused: it is a request,
    not a schedule.
  triggers:
    - trigger: state
      entity_id: input_boolean.goodnight
      to: "on"
  actions:
    - action: script.lighting_common_areas
      data:
        action: "off"
        transition: 3
    - action: light.turn_off
      target:
        area_id: living_room
      data:
        transition: 3
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
    - action: light.turn_off
      target:
        entity_id: light.office_filament
      data:
        transition: 3
    - delay: "00:00:05"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.goodnight
  mode: single
