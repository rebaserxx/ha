# ---------------------------------------------------------------------------------------------
# Lighting schedules (audit Phase 4, 2026-09-15).
# Rules: every scheduled automation checks input_boolean.lighting_automations_paused, calls a
# wrapper script with a PROFILE NAME (numbers live only in script.lighting_apply_profile_core),
# and uses sun ELEVATION instead of sunrise/sunset + seasonal delays, so nothing here holds a
# multi-minute delay that a restart could lose. Bedrooms are never touched by these schedules.
# Elevation thresholds (52.3 N): below 4 deg = roughly 15 (summer) to 30 (equinox) to 35 (winter)
# minutes before sunset; above 5 deg = the same after sunrise. Tune here if the family notices.
# ---------------------------------------------------------------------------------------------

- id: lighting_evening_set_on_at_dusk
  alias: Lighting - Evening Set On At Dusk
  description: >-
    Turn on the common areas, Lounge and David's Office filament when the sun drops below
    4 degrees. Full brightness before 19:00; after 19:00 (summer) come straight on at the
    evening profile, which is what the 19:00 dim would otherwise have produced.
  triggers:
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: 4
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: state
      entity_id: sun.sun
      attribute: rising
      state: false
  actions:
    - action: script.lighting_evening_set
      data:
        profile: "{{ 'evening_full' if now().hour < 19 else 'evening' }}"
        action: "on"
        transition: 3
    - action: light.turn_on
      target:
        entity_id: light.office_filament
      data:
        brightness_pct: "{{ 100 if now().hour < 19 else 80 }}"
        color_temp_kelvin: 2700
        transition: 3
  mode: single

- id: lighting_evening_dim_1900
  alias: Lighting - Evening Lights Dim To 80% At 19:00
  description: At 19:00 reduce evening-set, porch and office filament lights that are already on to the evening profile. Never turns anything on.
  triggers:
    - trigger: time
      at: "19:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
  actions:
    - action: script.lighting_dim_if_on
      data:
        target_areas:
          - attic_lounge
          - dining_room
          - kitchen
          - hallway
          - landing
          - side_hall
          - living_room
          - front_porch
        extra_entities:
          - light.office_filament
        profile: evening
        transition: 3
  mode: single

- id: lighting_evening_set_dim_late
  alias: Lighting - Evening Set Dim To 15% (Sun-Thu 22:15, Fri-Sat 23:30)
  description: Late-evening dim of lights that are already on in the common areas and Lounge. Never turns anything on (the pre-2026-09-15 version did).
  triggers:
    - trigger: time
      at: "22:15:00"
      id: weeknight
    - trigger: time
      at: "23:30:00"
      id: weekend
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: weeknight
            - condition: time
              weekday: [sun, mon, tue, wed, thu]
        - condition: and
          conditions:
            - condition: trigger
              id: weekend
            - condition: time
              weekday: [fri, sat]
  actions:
    - action: script.lighting_dim_if_on
      data:
        target_areas:
          - attic_lounge
          - dining_room
          - kitchen
          - hallway
          - landing
          - side_hall
          - living_room
        profile: late
        transition: 4
  mode: single

- id: lighting_evening_set_off_late
  alias: Lighting - Evening Set Off (Sun-Thu 23:00, Fri-Sat 23:59)
  description: Turn off the common areas, Lounge and David's Office filament late in the evening.
  triggers:
    - trigger: time
      at: "23:00:00"
      id: weeknight
    - trigger: time
      at: "23:59:00"
      id: weekend
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: weeknight
            - condition: time
              weekday: [sun, mon, tue, wed, thu]
        - condition: and
          conditions:
            - condition: trigger
              id: weekend
            - condition: time
              weekday: [fri, sat]
  actions:
    - action: script.lighting_evening_set
      data:
        action: "off"
        transition: 3
    - action: light.turn_off
      target:
        entity_id: light.office_filament
      data:
        transition: 3
  mode: single

- id: lighting_overnight_shutdown_0200
  alias: Lighting - Overnight Shutdown 02:00
  description: "Safety net at 02:00: common areas, Lounge, outside and the office filament off. Bedrooms are left alone."
  triggers:
    - trigger: time
      at: "02:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
  actions:
    - action: script.lighting_evening_set
      data:
        action: "off"
        transition: 2
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
    - action: light.turn_off
      target:
        entity_id: light.office_filament
      data:
        transition: 2
  mode: single

- id: lighting_common_morning_presunrise
  alias: Lighting - Common Areas On Pre-Sunrise (Mon-Thu 06:20, Fri 06:50)
  description: Turn on the common areas (not Lounge) on weekday mornings if the sun has not risen yet.
  triggers:
    - trigger: time
      at: "06:20:00"
      id: mon_thu
    - trigger: time
      at: "06:50:00"
      id: fri
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: sun
      before: sunrise
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: mon_thu
            - condition: time
              weekday: [mon, tue, wed, thu]
        - condition: and
          conditions:
            - condition: trigger
              id: fri
            - condition: time
              weekday: [fri]
  actions:
    - action: script.lighting_common_areas
      data:
        profile: morning
        action: "on"
        transition: 2
  mode: single

- id: lighting_common_off_after_sunrise
  alias: Lighting - Common + Lounge + Porch Off After Sunrise
  description: Off once the sun is 5 degrees up (roughly 15 to 35 minutes after sunrise depending on season). No delay, so a restart cannot lose it. Bedrooms and task lights are left alone.
  triggers:
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: 5
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: state
      entity_id: sun.sun
      attribute: rising
      state: true
  actions:
    - action: script.lighting_evening_set
      data:
        action: "off"
        transition: 2
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
  mode: single

- id: lighting_front_porch_on_at_sunset
  alias: Lighting - Front Porch On At Sunset
  description: Turn on the front porch at sunset every day.
  triggers:
    - trigger: sun
      event: sunset
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
  actions:
    - action: script.lighting_outside
      data:
        profile: evening_full
        action: "on"
        transition: 2
  mode: single

- id: lighting_front_porch_off_2300
  alias: Lighting - Front Porch Off 23:00
  description: Turn off the front porch at 23:00 every day.
  triggers:
    - trigger: time
      at: "23:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
  actions:
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
  mode: single

- id: lighting_front_porch_on_0620_presunrise
  alias: Lighting - Front Porch On 06:20 Pre-Sunrise
  description: Turn on the front porch at 06:20 every day if the sun has not risen yet.
  triggers:
    - trigger: time
      at: "06:20:00"
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
    - condition: sun
      before: sunrise
  actions:
    - action: script.lighting_outside
      data:
        profile: morning
        action: "on"
        transition: 2
  mode: single

- id: lighting_front_porch_off_at_sunrise
  alias: Lighting - Front Porch Off At Sunrise
  description: Turn off the front porch at sunrise every day.
  triggers:
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.lighting_automations_paused
      state: "off"
  actions:
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
  mode: single

- id: lighting_front_porch_motion_overnight
  alias: Lighting - Front Porch Motion Overnight
  description: >-
    Between 23:00 and 06:20, motion at the front porch turns the porch on at 50% and off again
    three minutes after motion clears. Pinned to the physical Hue outdoor sensor (the Hue "room"
    aggregate sensor duplicated it). Deliberately NOT gated by lighting_automations_paused.
  triggers:
    - trigger: state
      entity_id: binary_sensor.hue_outdoor_motion_sensor_1_motion
      to: "on"
  conditions:
    - condition: time
      after: "23:00:00"
      before: "06:20:00"
  actions:
    - action: light.turn_on
      target:
        area_id: front_porch
      data:
        brightness_pct: 50
        color_temp_kelvin: 2000
        transition: 1
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.hue_outdoor_motion_sensor_1_motion
          to: "off"
          for: "00:03:00"
      timeout: "00:20:00"
      continue_on_timeout: true
    # If the 06:20 schedule has taken over meanwhile, leave the porch to it.
    - condition: template
      value_template: "{{ now().strftime('%H:%M') < '06:20' or now().strftime('%H:%M') >= '23:00' }}"
    - action: script.lighting_outside
      data:
        action: "off"
        transition: 2
  mode: restart

- id: hot_water_pump_follow_tado_on_for_1h
  alias: Hot Water - Run Water Pump For 1 Hour When Tado Turns On
  description: When Tado hot water power demand turns on, run the Meross water pump and start a visible one-hour runtime timer.
  triggers:
    - trigger: state
      entity_id: binary_sensor.hot_water_power
      from: "off"
      to: "on"
  conditions: []
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.hot_water_pump
    - action: timer.start
      target:
        entity_id: timer.hot_water_pump_runtime
  mode: single

- id: hot_water_pump_off_when_runtime_finishes
  alias: Hot Water - Turn Water Pump Off When Runtime Finishes
  description: Turn off the Meross water pump when the Tado-triggered one-hour runtime timer finishes or is cancelled from the dashboard.
  triggers:
    - trigger: event
      event_type:
        - timer.finished
        - timer.cancelled
      event_data:
        entity_id: timer.hot_water_pump_runtime
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.hot_water_pump
  mode: single

- id: hot_water_pump_manual_auto_off_30m
  alias: Hot Water - Manual Water Pump Auto Off After 30 Minutes
  description: If the water pump is turned on manually or physically (not by an automation), turn it off after 30 minutes.
  triggers:
    - trigger: state
      entity_id: switch.hot_water_pump
      from: "off"
      to: "on"
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id is none }}"
  actions:
    - delay: "00:30:00"
    - condition: state
      entity_id: switch.hot_water_pump
      state: "on"
    - condition: state
      entity_id: binary_sensor.hot_water_power
      state: "off"
    - action: switch.turn_off
      target:
        entity_id: switch.hot_water_pump
  mode: restart

- id: tado_gas_meter_reading_weekly_from_octopus
  alias: Tado - Submit Weekly Gas Meter Reading From Octopus
  description: Submit the statistics-derived cumulative gas register to Tado Energy IQ weekly, dated at the end of the underlying statistics data. Checks daily and submits once at least 7 days have passed and the integer register has increased. No freshness condition needed because readings are dated at their data horizon.
  triggers:
    - trigger: time
      at: "18:00:00"
  conditions:
    - condition: template
      value_template: >-
        {{ states('sensor.tado_gas_meter_register_derived')
           not in ['unknown', 'unavailable', 'none', 'None', ''] }}
    - condition: template
      value_template: >-
        {% set last = states('input_datetime.tado_gas_meter_last_submission_date') %}
        {{ last in ['unknown', 'unavailable', '']
           or (now().date() - strptime(last, '%Y-%m-%d').date()).days >= 7 }}
    - condition: template
      value_template: >-
        {{ states('sensor.tado_gas_meter_register_derived') | float(0) | int(0)
           > states('input_number.tado_gas_meter_last_submitted_m3') | float(0) | int(0) }}
  actions:
    - variables:
        tado_register_m3: "{{ states('sensor.tado_gas_meter_register_derived') | float(0) | int(0) }}"
        reading_date: >-
          {{ ((state_attr('sensor.octopus_gas_statistics_total', 'last_stat_ts') | float(0)) + 3600)
             | timestamp_custom('%Y-%m-%d') }}
    - action: shell_command.tado_submit_dated_meter_reading
      data:
        reading: "{{ tado_register_m3 }}"
        date: "{{ reading_date }}"
      response_variable: submit_result
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ submit_result.returncode == 0 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.tado_gas_meter_last_submitted_m3
              data:
                value: "{{ tado_register_m3 }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tado_gas_meter_last_submission_date
              data:
                date: "{{ now().date() | string }}"
            - action: persistent_notification.dismiss
              data:
                notification_id: tado_gas_meter_submission_failed
      default:
        - action: persistent_notification.create
          data:
            notification_id: tado_gas_meter_submission_failed
            title: Tado Gas Meter Submission Failed
            message: >-
              Dated meter reading submission failed (reading {{ tado_register_m3 }},
              date {{ reading_date }}). Will retry tomorrow at 18:00.
              stderr: {{ submit_result.stderr | default('') | truncate(400) }}
  mode: single

- id: tado_gas_meter_submission_overdue_alert
  alias: Tado - Gas Meter Submission Overdue Alert
  description: Alert if no Tado gas meter reading has been submitted for more than 10 days.
  triggers:
    - trigger: time
      at: "19:00:00"
  conditions: []
  actions:
    - variables:
        last_submission: "{{ states('input_datetime.tado_gas_meter_last_submission_date') }}"
        days_since: >-
          {% if last_submission in ['unknown', 'unavailable', ''] %}
            999
          {% else %}
            {{ (now().date() - strptime(last_submission, '%Y-%m-%d').date()).days }}
          {% endif %}
        last_stat_ts: "{{ state_attr('sensor.octopus_gas_statistics_total', 'last_stat_ts') | float(0) }}"
        stat_age_days: >-
          {{ ((now().timestamp() - last_stat_ts) / 86400) | round(1) if last_stat_ts > 0 else 'unknown' }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ days_since | int(0) > 10 }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: tado_gas_meter_submission_overdue
                title: Tado Gas Meter Submission Overdue
                message: >-
                  No Tado gas meter reading submitted for {{ days_since | int(0) }} days
                  (last: {{ last_submission }}).
                  Octopus statistics data age: {{ stat_age_days }} days.
                  Derived register: {{ states('sensor.tado_gas_meter_register_derived') }} m³.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: tado_gas_meter_submission_overdue
  mode: single

- id: octopus_energy_gas_rollover_health_daily_check
  alias: Octopus Energy - Gas Rollover Health Check
  description: Alert if Octopus gas previous-day rollover (last_reset) is missing or 2+ days stale.
  triggers:
    - trigger: time
      at: "23:45:00"
  conditions: []
  actions:
    - variables:
        gas_kwh_sensor: sensor.octopus_energy_gas_e6s10414361656_2215950002_previous_accumulative_consumption_kwh
        gas_m3_sensor: sensor.octopus_energy_gas_e6s10414361656_2215950002_previous_accumulative_consumption_m3
        expected_last_reset_date: "{{ ((today_at('00:00') - timedelta(days=1)).date() | string) }}"
        gas_kwh_state: "{{ states(gas_kwh_sensor) }}"
        gas_m3_state: "{{ states(gas_m3_sensor) }}"
        gas_last_reset_raw: "{{ state_attr(gas_kwh_sensor, 'last_reset') }}"
        gas_last_reset_date: >-
          {% if gas_last_reset_raw in [none, 'unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ (gas_last_reset_raw | as_datetime | as_local).date() | string }}
          {% endif %}
        gas_days_behind: >-
          {% if gas_last_reset_date == 'unknown' %}
            999
          {% else %}
            {{ ((today_at('00:00') - timedelta(days=1)).date() - (gas_last_reset_raw | as_datetime | as_local).date()).days }}
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ gas_kwh_state in ['unknown', 'unavailable', 'none', 'None', '']
                   or gas_days_behind | int(999) >= 2 }}
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: octopus_energy_gas_rollover_health
                title: Octopus Energy Gas Rollover Check Failed
                message: >-
                  Octopus gas last_reset is {{ gas_days_behind | int(999) }} day(s) behind:
                  expected {{ expected_last_reset_date }}, got {{ gas_last_reset_date }} (local date).
                  kWh state: {{ gas_kwh_state }}.
                  m3 state: {{ gas_m3_state }}.
                  Check Octopus integration diagnostics and Energy statistics continuity.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: octopus_energy_gas_rollover_health
  mode: single

- id: system_backup_stale_daily_check
  alias: System - Backup Stale Daily Check
  description: Alert if Home Assistant automatic backups are stale or backup manager sensors are unhealthy.
  triggers:
    - trigger: time
      at: "09:00:00"
  conditions: []
  actions:
    - variables:
        last_success_raw: "{{ states('sensor.backup_last_successful_automatic_backup') }}"
        last_attempted_raw: "{{ states('sensor.backup_last_attempted_automatic_backup') }}"
        next_backup_raw: "{{ states('sensor.backup_next_scheduled_automatic_backup') }}"
        manager_state: "{{ states('sensor.backup_backup_manager_state') }}"
        last_success_ts: >-
          {% if last_success_raw in ['unknown', 'unavailable', 'none', 'None', ''] %}
            0
          {% else %}
            {{ as_timestamp(last_success_raw, 0) }}
          {% endif %}
        backup_age_hours: "{{ ((as_timestamp(now()) - (last_success_ts | float(0))) / 3600) | round(1) }}"
        backup_stale: "{{ (last_success_ts | float(0)) == 0 or (as_timestamp(now()) - (last_success_ts | float(0))) > 36 * 3600 }}"
        manager_unhealthy: "{{ manager_state in ['unknown', 'unavailable', 'none', 'None', '', 'failed', 'error'] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ backup_stale or manager_unhealthy }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: system_backup_health
                title: Home Assistant Backup Check Failed
                message: >-
                  Last successful automatic backup: {{ last_success_raw }}.
                  Backup age: {{ backup_age_hours }} hours.
                  Last attempted backup: {{ last_attempted_raw }}.
                  Next scheduled backup: {{ next_backup_raw }}.
                  Backup manager state: {{ manager_state }}.
                  Check Settings > System > Backups and confirm Home Assistant Cloud backup status.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: system_backup_health
  mode: single

- id: system_watchman_daily_check
  alias: System - Watchman Daily Check
  description: Alert if Watchman reports missing entities/actions or if Watchman sensors are unavailable.
  triggers:
    - trigger: time
      at: "09:05:00"
  conditions: []
  actions:
    - variables:
        watchman_status: "{{ states('sensor.watchman_status') }}"
        missing_entities_raw: "{{ states('sensor.watchman_missing_entities') }}"
        missing_actions_raw: "{{ states('sensor.watchman_missing_actions') }}"
        missing_entities_count: "{{ missing_entities_raw | int(0) }}"
        missing_actions_count: "{{ missing_actions_raw | int(0) }}"
        last_parse_raw: "{{ states('sensor.watchman_last_parse') }}"
        parse_duration_raw: "{{ states('sensor.watchman_parse_duration') }}"
        watchman_unavailable: >-
          {{ watchman_status in ['unknown', 'unavailable', 'none', 'None', '']
             or missing_entities_raw in ['unknown', 'unavailable', 'none', 'None', '']
             or missing_actions_raw in ['unknown', 'unavailable', 'none', 'None', ''] }}
        watchman_has_issues: "{{ (missing_entities_count | int(0)) > 0 or (missing_actions_count | int(0)) > 0 or watchman_unavailable }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ watchman_has_issues }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: system_watchman_health
                title: Watchman Found Home Assistant Issues
                message: >-
                  Watchman status: {{ watchman_status }}.
                  Missing entities: {{ missing_entities_raw }}.
                  Missing actions: {{ missing_actions_raw }}.
                  Last parse: {{ last_parse_raw }}.
                  Parse duration: {{ parse_duration_raw }}.
                  Open the Home Health dashboard or run Watchman report generation before editing dependent YAML.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: system_watchman_health
  mode: single

- id: ev_ohme_sync_renault_state_of_charge
  alias: EV - Sync Renault State of Charge to Ohme
  description: >-
    Keep Ohme's idea of the Renault's battery level correct while it is plugged in at home,
    because Ohme has disabled its own Renault integration and its internal estimate drifts
    badly on long top-ups (measured: Ohme's figure updated 3 times in 7 hours over a 51->91%
    session while the Renault reported 40 times).
    Writes only the state-of-charge input, which the integration maps to
    PUT /v1/car/{id}/state-of-charge - it touches no session endpoint, so it cannot start,
    approve or resume a charge. Intelligent Octopus Go keeps control of when charging happens.
    The charger is shared with a Honda e:Ny1, which since 2026-09-01 has its own Home
    Assistant entities and its own paired automation (ev_ohme_sync_honda_state_of_charge).
    Which car is on the cable is decided by the shared claim gate described in the actions
    below, NOT by an instantaneous read of the Renault's own sensors.
  triggers:
    # Ohme sees the plug-in first - measured 2026-09-03: Ohme reached pending_approval at
    # 09:11:52 while the Renault did not confirm the plug until 09:15:57, 4m05s later.
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      from: unplugged
      not_to: ["unavailable", "unknown"]
      id: plugged_in
    # ...so the Renault confirming the plug is also a trigger, otherwise the run above
    # fails its plug condition and nothing ever retries it.
    - trigger: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      to: "on"
      id: renault_plugged
    # The Renault polls every 7 minutes and reports ~1% per poll at 7kW, which is what
    # keeps Ohme corrected through a long charge.
    - trigger: state
      entity_id: sensor.renault_scenic_e_tech_battery
      not_to: ["unavailable", "unknown"]
      id: soc_refreshed
    # Retry tick. Without one, a run that aborts at the claim gate is never retried unless
    # the Renault's battery happens to change - and a parked car's battery does not change.
    # On 2026-09-03 that left Ohme holding a wrong 55% figure for over 3 hours. The 15-minute
    # throttle below applies to this trigger, so it is effectively a 15-minute retry.
    - trigger: time_pattern
      minutes: "/5"
      id: retry_tick
  conditions:
    # Ohme must have a car connected. state_of_charge_input is unavailable when unplugged.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.ohme_home_pro_status
          state: ["unplugged", "unavailable", "unknown"]
    # Mid-charge corrections are throttled to one per 15 minutes (~20 writes on a 40% top-up
    # instead of ~39, keeping Ohme within ~2%). A deadband was measured and rejected: it only
    # cut 39 fires to 38, because the gap is large rather than marginal. Plug-in triggers
    # bypass the throttle - that write sets the figure Ohme plans the whole session against.
    - condition: or
      conditions:
        - condition: trigger
          id: ["plugged_in", "renault_plugged"]
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 900 }}
  actions:
    # Ask the Honda to report in, so that "the Honda is not on the cable" is a FRESH
    # conclusion rather than an assumption drawn from hours-old cloud data. Best effort
    # only: the press raises "Unable to refresh data from vehicle" when the car is asleep
    # or out of signal, which must not abort the Renault's run, and the claim gate below
    # already refuses to count a stale Honda as claiming the cable.
    - action: button.press
      target:
        entity_id: button.e_ny1_refresh_from_car
      continue_on_error: true
    - wait_template: >-
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {{ t is not none and (now() - t).total_seconds() < 300 }}
      timeout: "00:02:00"
      continue_on_timeout: true
    # CLAIM GATE. Wait until exactly one car claims the cable. Both cars' sensors lag the
    # charger badly and in opposite ways, so neither an instantaneous read nor a fixed delay
    # is safe:
    #   - 2026-09-02: the Renault was unplugged but its plug sensor still read `on` for 46s,
    #     which made the Renault automation approve a Honda session.
    #   - 2026-09-03: the Honda's cloud went unreachable at 03:26 and its plug_status froze
    #     at `plugged_in` for 12 hours, so the Honda claimed a cable it was not on and this
    #     gate could never resolve. Hence the freshness qualifier on the Honda's claim: data
    #     that old is not evidence, so a stale Honda is treated as NOT claiming.
    # The Renault has no equivalent last-updated sensor; its 46s stale window is covered by
    # the settle delay and re-check below rather than by a freshness test.
    - wait_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r != h }}
      timeout: "00:06:00"
      continue_on_timeout: false
    # Hold, then re-check on settled data. This is what catches a sensor that is briefly
    # and wrongly still reporting the previous car: on 2026-09-03 the Renault's plug sensor
    # landed at 09:15:57 and its GPS only reached `home` at 09:16:01 - four seconds later.
    # The old instantaneous condition failed on that four-second gap and aborted the run.
    - delay: "00:01:00"
    - condition: template
      value_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r and not h }}
    # Usable reading, and only write when Ohme does not already agree. The vehicle check
    # matters: Ohme's figure describes whichever car is selected, so comparing against it
    # while the Honda is still selected compares two different cars.
    # No staleness gate on the Renault: a reading that looks days old is still correct when
    # the car has been parked, and the 7-minute poll tracks a charge accurately.
    - condition: template
      value_template: >-
        {% set r = states('sensor.renault_scenic_e_tech_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ 0 <= r <= 100 and (
             not is_state('select.ohme_home_pro_vehicle','Renault Scenic (2023-2025)')
             or (r | round(0) | int) != (o | round(0) | int)) }}
    # Ohme applies state-of-charge to the selected vehicle (client._cars[0]), so make sure
    # that is the Renault before writing. This is PUT /v1/car/{id}/select - it cannot start
    # a charge. The vehicle select uses the 30-minute device-info coordinator and its
    # refresh is debounced, so allow it to land before writing.
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.ohme_home_pro_vehicle
                  state: "Renault Scenic (2023-2025)"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.ohme_home_pro_vehicle
              data:
                option: "Renault Scenic (2023-2025)"
            - delay: "00:00:30"
    - action: number.set_value
      target:
        entity_id: number.utilities_ohme_home_pro_state_of_charge_input
      data:
        value: "{{ states('sensor.renault_scenic_e_tech_battery') | float(0) | round(0) | int }}"
  mode: single
  max_exceeded: silent

- id: ev_ohme_auto_approve_renault_charge
  alias: EV - Auto-Approve Ohme Charge for Renault
  description: >-
    Approve a pending Ohme charge session automatically when the Renault is the car on the
    cable at home, so it does not sit waiting for a tap in the app.
    UNLIKE ev_ohme_sync_renault_state_of_charge, this automation DELIBERATELY starts a charge.
    It presses button.ohme_home_pro_approve_charge, which maps to
    PUT /v1/chargeSessions/{serial}/approve?approve=true. Ohme and Intelligent Octopus Go
    decide timing from there, but approving can begin delivery immediately at the prevailing
    rate - on 2026-08-31 a manually approved smart_charge session went to 7 kW straight away
    in the afternoon at 27.95p/kWh. That cost trade-off was reviewed and accepted by the
    project user. Keep charge-causing actions in THIS automation and its Honda counterpart
    only.
    INCIDENT 2026-09-02: this automation approved a HONDA session as if it were the Renault,
    because the Renault's plug sensor still read `on` 46s after it was unplugged.
    INCIDENT 2026-09-03: the reverse - a genuine Renault session sat unapproved for over
    3 hours, because the run triggered 4 seconds before the Renault's GPS reached `home`,
    failed an instantaneous location check, and nothing ever retried it.
    Both are addressed by the claim gate, the settle-and-recheck, and the retry tick below.
  triggers:
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      to: pending_approval
      id: session_pending
    # Ohme reaches pending_approval about 4 minutes before the Renault confirms the plug,
    # so at the moment of session_pending the car checks below are still false. This second
    # trigger is what usually carries the approval through.
    - trigger: state
      entity_id: binary_sensor.renault_scenic_e_tech_plug
      to: "on"
      id: renault_plugged
    # The Renault's GPS trails its plug sensor, so its arrival is a trigger too.
    - trigger: state
      entity_id: device_tracker.renault_scenic_e_tech_location
      to: home
      id: renault_home
    # Retry tick, gated by the pending_approval condition below and therefore self-limiting:
    # once the session is approved (or the car unplugged) the condition stops passing.
    # Added after 2026-09-03, when every edge trigger had already fired and failed and the
    # session simply stayed pending for the rest of the day.
    - trigger: time_pattern
      minutes: "/5"
      id: retry_tick
  conditions:
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
    # Never auto-approve a flat-out max charge. Written as a negation on purpose:
    # select.ohme_home_pro_charge_mode is `unavailable` during PENDING_APPROVAL because
    # client.mode is None in that state, so requiring `smart_charge` would never pass.
    - condition: not
      conditions:
        - condition: state
          entity_id: select.ohme_home_pro_charge_mode
          state: max_charge
  actions:
    # Best-effort Honda refresh so that "the Honda is not on the cable" is a fresh
    # conclusion. Must not abort this run when the Honda is unreachable - see the sync
    # automation for the reasoning.
    - action: button.press
      target:
        entity_id: button.e_ny1_refresh_from_car
      continue_on_error: true
    - wait_template: >-
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {{ t is not none and (now() - t).total_seconds() < 300 }}
      timeout: "00:02:00"
      continue_on_timeout: true
    # CLAIM GATE, then settle and re-check on stable data. The car-identity checks are
    # deliberately here rather than in `conditions:`, so they run on settled data and so
    # that a car whose sensors have not caught up yet is WAITED FOR rather than rejected.
    - wait_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r != h }}
      timeout: "00:06:00"
      continue_on_timeout: false
    - delay: "00:01:00"
    - condition: template
      value_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r and not h }}
    # Let the state-of-charge sync land first so Ohme plans this session against the
    # Renault's real battery level rather than a stale or wrong-vehicle figure. Approve
    # anyway on timeout rather than leaving the car waiting indefinitely.
    # The vehicle check is part of the match: a bare number comparison passed against the
    # PREVIOUS car's figure during the 2026-09-02 swap.
    - wait_template: >-
        {% set r = states('sensor.renault_scenic_e_tech_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ is_state('select.ohme_home_pro_vehicle','Renault Scenic (2023-2025)')
           and 0 <= r <= 100 and (r | round(0) | int) == (o | round(0) | int) }}
      timeout: "00:05:00"
      continue_on_timeout: true
    # It may have been approved in the app while we waited.
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
    - action: button.press
      target:
        entity_id: button.ohme_home_pro_approve_charge
  mode: single
  max_exceeded: silent

- id: ev_ohme_sync_honda_state_of_charge
  alias: EV - Sync Honda State of Charge to Ohme
  description: >-
    Keep Ohme's idea of the Honda e:Ny1's battery level correct while it is plugged in at
    home. Mirrors ev_ohme_sync_renault_state_of_charge for the second car on the shared
    charger. Writes only the state-of-charge input, which the integration maps to
    PUT /v1/car/{id}/state-of-charge - it touches no session endpoint, so it cannot start,
    approve or resume a charge. Intelligent Octopus Go keeps control of when charging happens.
    DIFFERENCE FROM THE RENAULT: the Renault polls every ~7 minutes, so its readings can be
    trusted as-is. The Honda's cloud data can be many hours stale - measured 6h50m old on
    2026-09-01, and on 2026-09-03 the car was unreachable for over 12 hours with
    button.e_ny1_refresh_from_car raising "Unable to refresh data from vehicle". So this
    automation forces a refresh and waits for sensor.e_ny1_last_updated to advance before
    trusting ANY Honda reading, and aborts rather than writing a stale figure.
  triggers:
    # Ohme sees the plug-in first, before either car's cloud catches up.
    - trigger: state
      entity_id: sensor.ohme_home_pro_status
      from: unplugged
      not_to: ["unavailable", "unknown"]
      id: plugged_in
    - trigger: state
      entity_id: sensor.e_ny1_plug_status
      to: ["plugged_in", "connected"]
      id: honda_plugged
    - trigger: state
      entity_id: sensor.e_ny1_battery
      not_to: ["unavailable", "unknown"]
      id: soc_refreshed
    # The Honda does not stream updates through a charge the way the Renault does (~40 per
    # session), so poll it while Ohme holds the car. Waking it this often is acceptable
    # precisely because it is sitting on mains at the time.
    # NOTE: this tick deliberately does NOT require the Honda to already be the selected
    # vehicle in Ohme. An earlier version did, which made it unable to bootstrap: the Honda
    # is only ever selected BY this automation, so if the plug-in triggers were missed the
    # tick could never recover the session.
    - trigger: time_pattern
      minutes: "/15"
      id: charge_tick
  conditions:
    # Ohme must have a car connected. state_of_charge_input is unavailable when unplugged.
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.ohme_home_pro_status
          state: ["unplugged", "unavailable", "unknown"]
    # The periodic tick applies while Ohme is charging OR still waiting for approval, so the
    # car is not woken every 15 minutes for sitting on a finished cable. pending_approval was
    # added 2026-09-03: without it a session whose plug-in triggers all failed could never be
    # recovered by the tick, which is exactly what happened that morning.
    - condition: or
      conditions:
        - condition: not
          conditions:
            - condition: trigger
              id: charge_tick
        - condition: state
          entity_id: sensor.ohme_home_pro_status
          state: ["charging", "pending_approval"]
    # Mid-charge corrections are throttled. Plug-in triggers bypass the throttle - that
    # write sets the figure Ohme plans the whole session against.
    - condition: or
      conditions:
        - condition: trigger
          id: ["plugged_in", "honda_plugged"]
        - condition: template
          value_template: >-
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 870 }}
  actions:
    # Force fresh data before trusting any Honda sensor. Abort on timeout: writing a stale
    # battery figure is worse than not writing at all, because Ohme would plan against it.
    # continue_on_error is required - the press RAISES when the car cannot be reached, and
    # an unhandled error kills the run before the wait below can abort it cleanly.
    - action: button.press
      target:
        entity_id: button.e_ny1_refresh_from_car
      continue_on_error: true
    - wait_template: >-
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {{ t is not none and (now() - t).total_seconds() < 300 }}
      timeout: "00:02:00"
      continue_on_timeout: false
    # CLAIM GATE, then settle and re-check - see ev_ohme_sync_renault_state_of_charge for
    # the two incidents this shape exists to prevent. The Honda's own freshness is already
    # guaranteed by the wait above; the qualifier is repeated here so the four automations
    # share one identical gate.
    - wait_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r != h }}
      timeout: "00:06:00"
      continue_on_timeout: false
    - delay: "00:01:00"
    - condition: template
      value_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ h and not r }}
    # Usable reading, and only write when Ohme does not already agree. The vehicle check
    # matters: Ohme's figure describes whichever car is selected, so comparing against it
    # while the Renault is still selected compares two different cars.
    - condition: template
      value_template: >-
        {% set h = states('sensor.e_ny1_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ 0 <= h <= 100 and (
             not is_state('select.ohme_home_pro_vehicle','Honda e:Ny1 (2023-)')
             or (h | round(0) | int) != (o | round(0) | int)) }}
    # Ohme applies state-of-charge to the selected vehicle, so make sure that is the Honda
    # before writing. This is PUT /v1/car/{id}/select - it cannot start a charge. The
    # vehicle select uses the 30-minute device-info coordinator and its refresh is
    # debounced, so allow it to land before writing.
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.ohme_home_pro_vehicle
                  state: "Honda e:Ny1 (2023-)"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.ohme_home_pro_vehicle
              data:
                option: "Honda e:Ny1 (2023-)"
            - delay: "00:00:30"
    - action: number.set_value
      target:
        entity_id: number.utilities_ohme_home_pro_state_of_charge_input
      data:
        value: "{{ states('sensor.e_ny1_battery') | float(0) | round(0) | int }}"
  mode: single
  max_exceeded: silent

- id: ev_ohme_auto_approve_honda_charge
  alias: EV - Auto-Approve Ohme Charge for Honda
  description: >-
    Approve a pending Ohme charge session automatically when the Honda e:Ny1 is the car on
    the cable at home, so it does not sit waiting for a tap in the app. Mirrors
    ev_ohme_auto_approve_renault_charge.
    LIKE THAT AUTOMATION, THIS ONE DELIBERATELY STARTS A CHARGE. It presses
