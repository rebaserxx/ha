    # Prove the Honda is really the car on the cable before approving anything. The refresh
    # press raises when the car is unreachable, so it is guarded; the wait below is what
    # decides, and it aborts the run when no fresh data arrives.
    - action: button.press
      target:
        entity_id: button.e_ny1_refresh_from_car
      continue_on_error: true
    - wait_template: >-
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {{ t is not none and (now() - t).total_seconds() < 300 }}
      timeout: "00:02:00"
      continue_on_timeout: false
    # CLAIM GATE, then settle and re-check on stable data.
    - wait_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ r != h }}
      timeout: "00:06:00"
      continue_on_timeout: false
    - delay: "00:01:00"
    - condition: template
      value_template: >-
        {% set r = is_state('binary_sensor.renault_scenic_e_tech_plug','on')
                   and is_state('device_tracker.renault_scenic_e_tech_location','home') %}
        {% set t = states('sensor.e_ny1_last_updated') | as_datetime %}
        {% set h = t is not none and (now() - t).total_seconds() < 1800
                   and states('sensor.e_ny1_plug_status') in ['plugged_in','connected']
                   and is_state('device_tracker.e_ny1_location','home') %}
        {{ h and not r }}
    # Let the state-of-charge sync land first so Ohme plans this session against the
    # Honda's real battery level rather than a stale or wrong-vehicle figure. The vehicle
    # check is part of the match: a bare number comparison can pass against the OTHER car's
    # figure, which is exactly what went wrong on 2026-09-02.
    - wait_template: >-
        {% set h = states('sensor.e_ny1_battery') | float(-1) %}
        {% set o = states('sensor.ohme_home_pro_vehicle_battery') | float(-2) %}
        {{ is_state('select.ohme_home_pro_vehicle','Honda e:Ny1 (2023-)')
           and 0 <= h <= 100 and (h | round(0) | int) == (o | round(0) | int) }}
      timeout: "00:05:00"
      continue_on_timeout: true
    # It may have been approved in the app while we waited.
    - condition: state
      entity_id: sensor.ohme_home_pro_status
      state: pending_approval
